<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food POS · Costa Rica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#eef0f6; --dim:#9aa0a8; --accent:#ff6b35; --accent2:#ffb347;
    --green:#00e676; --well:#14161a;
    --font:'Inter',system-ui,sans-serif; --mono:'Orbitron',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--font);color:var(--text);
    background:#2a2d33;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 2px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px),
      linear-gradient(135deg,rgba(255,255,255,.05),transparent 35%,rgba(0,0,0,.12) 65%,transparent),
      linear-gradient(180deg,#4a4d54,#35383f 50%,#3f4249);
    -webkit-tap-highlight-color:transparent;
  }
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* HEADER */
  .top-area{position:relative;z-index:200;flex-shrink:0}
  .app-header{
    display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;
    padding:12px 14px;border-bottom:1px solid #1a1c20;
    background:#5a5e66;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 2px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
      linear-gradient(135deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.15) 70%,transparent),
      linear-gradient(180deg,#6a6e76,#4a4d54 55%,#565a62);
    box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
  }
  .menu-toggle{
    width:40px;height:40px;border-radius:9px;border:1px solid #1a1c20;
    background:rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:4px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.3);
    transition:background .2s,transform .1s;
  }
  .menu-toggle:hover{background:rgba(0,0,0,.34)}
  .menu-toggle:active{transform:scale(.94)}
  .menu-toggle span{display:block;width:18px;height:2px;border-radius:2px;background:#dfe3ea;transition:transform .28s,opacity .2s,background .2s}
  body.menu-open .menu-toggle span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  body.menu-open .menu-toggle span:nth-child(2){opacity:0;transform:scaleX(0)}
  body.menu-open .menu-toggle span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  body.menu-open .menu-toggle span{background:var(--accent2)}
  .store-name{
    justify-self:center;max-width:100%;display:inline-flex;align-items:center;gap:9px;
    font-size:1.3rem;font-weight:900;letter-spacing:-.5px;color:#f4f6fa;
    cursor:pointer;user-select:none;padding:6px 14px;border-radius:10px;
    transition:background .2s,transform .1s;
    text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 18px rgba(255,179,71,.15);
    border:1px solid transparent;overflow:hidden;
  }
  .store-name:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
  .store-name:active{transform:scale(.98)}
  .logo-mark{font-size:1.35rem;flex-shrink:0}
  .store-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .header-spacer{width:40px}
  /* MENU CATEGORIAS */
  .cat-menu{
    position:absolute;top:100%;left:0;right:0;z-index:150;overflow:hidden;
    max-height:0;opacity:0;pointer-events:none;
    transition:max-height .36s,opacity .24s;
    background:#3a3d44;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 2px),
      linear-gradient(135deg,rgba(255,255,255,.1),transparent 45%,rgba(0,0,0,.16) 75%,transparent),
      linear-gradient(180deg,#4a4d54,#2c2f36 60%,#363940);
    border-bottom:2px solid #0a0b0e;border-radius:0 0 16px 16px;
  }
  .cat-menu.open{
    max-height:80vh;opacity:1;pointer-events:auto;overflow-y:auto;
    box-shadow:0 18px 44px rgba(0,0,0,.75);
  }
  .cat-menu-inner{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-width:900px;margin:0 auto}
  .cat-item{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
    border:1px solid #1a1c20;cursor:pointer;font-family:var(--font);font-size:.88rem;
    font-weight:700;color:var(--text);text-align:left;
    background:#5a5e66;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 2px),
      linear-gradient(135deg,rgba(255,255,255,.13),transparent 45%,rgba(0,0,0,.13) 75%,transparent),
      linear-gradient(180deg,#6a6e76,#4a4d54 60%,#565a62);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.28),0 2px 5px rgba(0,0,0,.35);
    transition:filter .18s,transform .1s;
  }
  .cat-item:hover{filter:brightness(1.1)}
  .cat-item:active{transform:scale(.97)}
  .cat-item.active{
    background-image:
      linear-gradient(135deg,rgba(255,179,71,.3),transparent 50%,rgba(0,0,0,.12) 75%,transparent),
      linear-gradient(180deg,#7a6a52,#5a4a38 60%,#6a5a44);
    border-color:rgba(255,107,53,.5);color:#fff5e8;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px rgba(255,107,53,.2);
  }
  .cat-item-emoji{font-size:1.25rem;flex-shrink:0}
  .cat-item-name{flex:1}
  .cat-item-count{
    font-size:.65rem;font-weight:800;color:var(--dim);
    background:rgba(0,0,0,.3);padding:2px 8px;border-radius:999px;
  }
  .cat-item.active .cat-item-count{color:var(--accent2)}
  .menu-backdrop{
    position:fixed;inset:0;z-index:140;display:none;
    background:rgba(6,8,11,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .menu-backdrop.show{display:block}
  /* MAIN */
  .app-main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 220px;scroll-behavior:smooth}
  .cat-title{
    max-width:1300px;margin:0 auto 14px;padding-left:4px;display:flex;align-items:center;
    gap:8px;font-size:1rem;font-weight:800;color:#dfe3ea;
  }
  .cat-title .ct-emoji{font-size:1.15rem}
  .product-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
    gap:12px;max-width:1300px;margin:0 auto;
  }
  .product-card{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 10px 13px;border-radius:10px;cursor:pointer;user-select:none;
    transition:transform .18s,box-shadow .18s,border-color .18s;
    border:1px solid #1a1c20;
    background:#4a4d54;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 2px),
      linear-gradient(135deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.14) 70%,transparent),
      linear-gradient(180deg,#565a62,#3d4048 60%,#464a52);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.28),0 2px 5px rgba(0,0,0,.35);
    position:relative;overflow:hidden;
    animation:cardIn .3s cubic-bezier(.34,1.3,.64,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .product-card:hover{transform:translateY(-3px);border-color:rgba(255,107,53,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.5)}
  .product-card:active{transform:scale(.96)}
  .svg-well{
    width:100%;display:flex;justify-content:center;align-items:center;
    padding:6px;border-radius:8px;background:var(--well);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
  }
  .svg-well svg{width:90px;height:90px;display:block}
  .p-name{
    font-size:.74rem;font-weight:600;text-align:center;line-height:1.22;
    color:#eef0f6;min-height:2.6em;display:flex;align-items:center;justify-content:center;
  }
  .p-price{
    font-size:.86rem;font-weight:800;color:var(--accent2);
    font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,179,71,.25);
  }
  /* REGISTER */
  .register{
    position:fixed;bottom:0;left:0;right:0;z-index:100;
    padding:12px 18px 14px;border-top:2px solid #0a0b0e;
    background:#1a1c20;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 2px),
      linear-gradient(180deg,#2a2d33,#17191d 60%,#1e2126);
    box-shadow:0 -12px 40px rgba(0,0,0,.65);
    display:flex;justify-content:center;
  }
  .register-inner{
    width:100%;max-width:900px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .register-total-block{display:flex;flex-direction:column;gap:2px;min-width:0}
  .register-label{
    font-size:.6rem;font-weight:800;letter-spacing:2.5px;color:var(--dim);
    text-transform:uppercase;
  }
  .seven-seg{
    font-family:var(--mono);font-size:clamp(1.7rem,5vw,2.7rem);font-weight:900;
    color:var(--green);
    text-shadow:0 0 6px rgba(0,230,118,.45),0 0 20px rgba(0,230,118,.18);
    letter-spacing:2px;line-height:1;font-variant-numeric:tabular-nums;
    transition:transform .15s;
  }
  .seven-seg.bump{transform:scale(1.07)}
  .register-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
  .register-top-row{display:flex;align-items:center;gap:10px}
  /* CLOCK */
  .clock-block{
    display:flex;flex-direction:column;align-items:flex-end;line-height:1;gap:2px;
  }
  #clockDisplay{
    font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--accent2);
    letter-spacing:1.5px;text-shadow:0 0 8px rgba(255,179,71,.3);
    font-variant-numeric:tabular-nums;
  }
  #ampmDisplay{
    font-family:var(--mono);font-size:.55rem;font-weight:800;color:var(--accent2);
    letter-spacing:3px;opacity:.75;
  }
  /* CART TAB */
  .cart-tab{
    display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-radius:10px;border:1px solid #1a1c20;cursor:pointer;
    font-family:var(--font);font-weight:700;font-size:.78rem;color:var(--text);
    transition:filter .2s,transform .1s,border-color .2s;
    background:#4a4d54;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 2px),
      linear-gradient(180deg,#565a62,#3d4048 60%,#464a52);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 5px rgba(0,0,0,.35);
  }
  .cart-tab:hover{filter:brightness(1.1);border-color:rgba(255,107,53,.4)}
  .cart-tab:active{transform:scale(.96)}
  .cart-tab.active{border-color:rgba(255,179,71,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 14px rgba(255,179,71,.3)}
  .cart-tab-lines{display:flex;flex-direction:column;gap:3px;width:16px}
  .cart-tab-lines span{display:block;height:2px;border-radius:1px;background:currentColor}
  .cart-tab-lines span:nth-child(2){width:12px}
  .cart-tab.active .cart-tab-lines span{background:var(--accent2)}
  .cart-tab-count{
    background:var(--accent);color:#fff;font-weight:900;font-size:.7rem;
    min-width:22px;height:22px;padding:0 6px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 0 10px rgba(255,107,53,.5);
  }
  .register-buttons{display:flex;gap:10px;align-items:center}
  .clear-btn{
    padding:12px 14px;border-radius:10px;border:1px solid #1a1c20;
    cursor:pointer;font-size:.95rem;color:#ffb3a8;font-family:var(--font);
    transition:filter .2s,transform .1s;
    background:#4a4d54;
    background-image:linear-gradient(180deg,#565a62,#3d4048 60%,#464a52);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 5px rgba(0,0,0,.35);
  }
  .clear-btn:hover{filter:brightness(1.1)}
  .clear-btn:active{transform:scale(.96)}
  .pay-btn{
    padding:13px 26px;border-radius:10px;border:1px solid #0a4a2a;cursor:pointer;
    font-family:var(--font);font-weight:900;font-size:.95rem;letter-spacing:1.5px;color:#fff;
    transition:filter .2s,transform .1s;
    background:#1e8449;
    background-image:
      repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 2px),
      linear-gradient(135deg,rgba(255,255,255,.2),transparent 45%,rgba(0,0,0,.15) 75%,transparent),
      linear-gradient(180deg,#2ecc71,#1e8449 55%,#239b56);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.35),0 0 22px rgba(0,230,118,.18);
    text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .pay-btn:hover{filter:brightness(1.1)}
  .pay-btn:active{transform:scale(.96)}
  /* CART PANEL */
  .cart-panel{
    position:fixed;left:0;right:0;bottom:0;z-index:160;
    background:#1a1c20;
    background-image:linear-gradient(180deg,#2a2d33,#14161a 60%,#1e2126);
    border-top:1px solid #0a0b0e;
    box-shadow:0 -18px 44px rgba(0,0,0,.7);
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;max-height:65vh;
    border-radius:16px 16px 0 0;pointer-events:none;
  }
  .cart-panel.open{transform:translateY(0);pointer-events:auto}
  .cart-panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 12px;border-bottom:1px solid #0a0b0e;
    background-image:linear-gradient(180deg,#4a4d54,#2c2f36 60%,#363940);
    border-radius:16px 16px 0 0;
  }
  .cart-panel-title{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:800;color:var(--text)}
  .cart-panel-title .grip{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
  .cart-panel-close{
    width:30px;height:30px;border-radius:50%;border:1px solid #1a1c20;cursor:pointer;
    background:rgba(0,0,0,.35);color:var(--dim);font-size:.85rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s,color .2s,transform .1s;
  }
  .cart-panel-close:hover{background:rgba(255,107,53,.2);color:var(--accent2)}
  .cart-panel-close:active{transform:scale(.92)}
  .cart-panel-list{flex:1;overflow-y:auto;padding:8px 14px;min-height:60px}
  .cart-empty{padding:30px 10px;text-align:center;font-size:.8rem;color:var(--dim);font-weight:600}
  .cart-row{
    display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;
    padding:10px 12px;margin-bottom:6px;border-radius:8px;
    background:rgba(255,255,255,.03);border:1px solid #2e3138;
  }
  .cart-row-qty{
    font-family:var(--mono);font-size:.72rem;font-weight:800;color:var(--accent2);
    background:rgba(255,107,53,.12);padding:3px 8px;border-radius:6px;
    min-width:32px;text-align:center;border:1px solid rgba(255,107,53,.25);
  }
  .cart-row-name{font-size:.78rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cart-row-price{font-family:var(--mono);font-size:.78rem;font-weight:800;color:#dfe3ea;white-space:nowrap}
  .cart-row-del{
    width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,107,53,.3);
    background:rgba(255,107,53,.08);color:var(--accent);font-weight:900;font-size:.8rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .2s,transform .1s;
  }
  .cart-row-del:hover{background:rgba(255,107,53,.25);border-color:var(--accent)}
  .cart-row-del:active{transform:scale(.9)}
  .cart-panel-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;border-top:1px solid #0a0b0e;background:rgba(0,0,0,.3);
    font-size:.8rem;font-weight:800;
  }
  .cart-panel-footer span:first-child{color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;font-size:.68rem}
  .cart-panel-footer span:last-child{
    font-family:var(--mono);font-size:1.15rem;color:var(--green);
    text-shadow:0 0 12px rgba(0,230,118,.4);
  }
  .cart-panel-backdrop{
    position:fixed;inset:0;z-index:155;display:none;
    background:rgba(6,8,11,.4);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .cart-panel-backdrop.show{display:block}
  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
    padding:20px;background:rgba(10,12,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .modal-overlay.show{display:flex}
  .modal{
    width:100%;max-width:380px;border-radius:18px;padding:24px;border:1px solid #1a1c20;
    background:#3a3d44;
    background-image:linear-gradient(135deg,rgba(255,255,255,.1),transparent 45%,rgba(0,0,0,.15) 75%,transparent),linear-gradient(180deg,#4a4d54,#2e3138 60%,#3a3d44);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 24px 60px rgba(0,0,0,.65);
  }
  .modal h3{font-size:.72rem;letter-spacing:2.5px;font-weight:800;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
  .modal input{
    width:100%;padding:14px 16px;border-radius:10px;border:1px solid #1a1c20;
    background:#1a1c20;color:var(--text);font-family:var(--font);font-size:1rem;
    font-weight:600;outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
  }
  .modal input:focus{border-color:rgba(255,107,53,.55);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(255,107,53,.15)}
  .modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
  .btn-secondary,.btn-primary{
    padding:11px 20px;border-radius:9px;border:1px solid #1a1c20;
    font-family:var(--font);font-size:.88rem;font-weight:700;cursor:pointer;
    transition:filter .2s,transform .1s;
  }
  .btn-secondary{color:var(--dim);background:#3a3d44;background-image:linear-gradient(180deg,#4a4d54,#2e3138)}
  .btn-secondary:hover{filter:brightness(1.1)}
  .btn-primary{color:#fff;background:#1e8449;background-image:linear-gradient(180deg,#2ecc71,#1e8449 60%,#239b56);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-secondary:active,.btn-primary:active{transform:scale(.97)}
  /* PAYMENT OVERLAY */
  .payment-overlay{
    position:fixed;inset:0;z-index:500;display:none;align-items:flex-start;justify-content:center;
    overflow-y:auto;padding:30px 20px;background:rgba(8,10,14,.9);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .payment-overlay.show{display:flex}
  .payment-stage{margin:auto;width:100%;max-width:420px}
  .stage-success{
    display:none;flex-direction:column;align-items:center;gap:22px;
    opacity:0;transform:scale(.85);
    transition:opacity .45s cubic-bezier(.34,1.56,.64,1),transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .stage-success.active{opacity:1;transform:scale(1)}
  .success-circle{width:130px;height:130px;filter:drop-shadow(0 0 30px rgba(0,230,118,.4))}
  .success-circle svg{width:100%;height:100%;display:block}
  .success-circle circle{stroke:var(--green);stroke-width:3.5;fill:rgba(0,230,118,.08);stroke-dasharray:285;stroke-dashoffset:285;transform-origin:50% 50%}
  .success-circle path{stroke:var(--green);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:70;stroke-dashoffset:70}
  .stage-success.active .success-circle circle{animation:drawCircle .65s forwards}
  .stage-success.active .success-circle path{animation:drawCheck .4s .55s forwards}
  @keyframes drawCircle{to{stroke-dashoffset:0}}
  @keyframes drawCheck{to{stroke-dashoffset:0}}
  .success-title{
    font-family:var(--mono);font-size:1.7rem;font-weight:900;letter-spacing:3px;
    color:var(--green);text-align:center;
    text-shadow:0 0 22px rgba(0,230,118,.55);
  }
  .success-amount{font-family:var(--mono);font-size:1.45rem;font-weight:700;color:#eef0f6;letter-spacing:1px}
  .success-sub{font-size:.7rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:600}
  .stage-receipt{display:none;flex-direction:column;align-items:center;width:100%}
  .printer-body{
    width:300px;max-width:100%;height:54px;border-radius:12px 12px 6px 6px;
    position:relative;z-index:2;border:1px solid #1a1c20;
    background:#4a4d54;
    background-image:linear-gradient(135deg,rgba(255,255,255,.14),transparent 45%,rgba(0,0,0,.15) 75%,transparent),linear-gradient(180deg,#6a6e76,#3d4048 55%,#565a62);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 20px rgba(0,0,0,.5);
  }
  .printer-led{
    position:absolute;top:18px;right:16px;width:7px;height:7px;border-radius:50%;
    background:var(--green);box-shadow:0 0 10px var(--green);animation:ledBlink 1s infinite alternate;
  }
  @keyframes ledBlink{from{opacity:.5}to{opacity:1}}
  .printer-slot{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    width:250px;max-width:88%;height:7px;border-radius:3px;
    background:#05060a;box-shadow:inset 0 2px 4px rgba(0,0,0,.9);
  }
  .receipt-wrap{
    width:270px;max-width:100%;max-height:0;overflow:hidden;position:relative;
    margin-top:-3px;transition:max-height 1.25s cubic-bezier(.4,0,.2,1);z-index:1;
  }
  .receipt{
    background:#f8f8f4;color:#1a1c20;padding:18px 18px 22px;
    font-family:'Courier New',monospace;font-size:.72rem;line-height:1.55;
    position:relative;margin-top:4px;box-shadow:0 14px 40px rgba(0,0,0,.55);
    max-height:50vh;overflow-y:auto;
  }
  .receipt-header{text-align:center;margin-bottom:6px}
  .receipt-store{font-weight:900;font-size:.92rem;margin-bottom:3px}
  .receipt-divider{color:#888;margin:5px 0;font-size:.68rem;white-space:nowrap;overflow:hidden}
  .receipt-line{display:flex;justify-content:space-between;gap:8px;font-size:.68rem}
  .receipt-line span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
  .receipt-line span:last-child{white-space:nowrap}
  .receipt-total{font-weight:900;font-size:.82rem;margin:4px 0}
  .receipt-footer{text-align:center;font-size:.66rem;margin-top:4px;line-height:1.5}
  .receipt-stamp{
    display:inline-block;color:#00874a;border:2px solid #00874a;padding:3px 10px;
    font-weight:900;font-size:.72rem;letter-spacing:1.5px;margin-top:12px;
    border-radius:4px;transform:rotate(-7deg);
  }
  .done-btn{
    margin-top:22px;padding:13px 40px;border-radius:10px;border:1px solid #1a1c20;
    cursor:pointer;font-family:var(--font);font-weight:800;font-size:.9rem;
    letter-spacing:1.5px;color:#fff;opacity:0;transform:translateY(10px);
    transition:opacity .35s,transform .35s,filter .2s;pointer-events:none;
    background:#4a4d54;
    background-image:linear-gradient(180deg,#6a6e76,#3d4048 60%,#565a62);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 14px rgba(0,0,0,.4);
  }
  .done-btn.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .done-btn:hover{filter:brightness(1.12)}
  .done-btn:active{transform:scale(.97)}
  /* TOAST */
  .toast{
    position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1e2126;color:var(--green);border:1px solid rgba(0,230,118,.3);
    padding:10px 22px;border-radius:999px;font-size:.8rem;font-weight:600;
    opacity:0;pointer-events:none;transition:all .3s;z-index:200;white-space:nowrap;
    box-shadow:0 8px 28px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){
    .app-header{padding:10px 12px}
    .store-name{font-size:1.05rem;padding:5px 10px;gap:7px}
    .logo-mark{font-size:1.15rem}
    .app-main{padding:12px 10px 230px}
    .cat-title{font-size:.9rem;margin-bottom:10px}
    .product-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
    .svg-well svg{width:72px;height:72px}
    .p-name{font-size:.68rem;min-height:2.8em}
    .p-price{font-size:.78rem}
    .cat-menu-inner{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;padding:10px}
    .cat-item{padding:11px 12px;font-size:.82rem}
    .register{padding:10px 12px 12px}
    .seven-seg{font-size:clamp(1.4rem,6vw,2rem)}
    #clockDisplay{font-size:.72rem}
    #ampmDisplay{font-size:.48rem}
    .pay-btn{padding:11px 16px;font-size:.8rem;letter-spacing:1px}
    .clear-btn{padding:10px 12px}
    .cart-tab{padding:7px 9px;font-size:.72rem}
    .cart-tab-count{min-width:20px;height:20px;font-size:.65rem}
    .success-circle{width:110px;height:110px}
    .success-title{font-size:1.3rem}
    .success-amount{font-size:1.1rem}
  }
  @media (max-width:380px){
    .product-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}

    .p-name{font-size:.63rem}
    .register-top-row{gap:8px}
    .cart-tab{font-size:.68rem;padding:6px 8px}
  }

<div class="app">
  <div class="top-area">

</div>

<div class="menu-backdrop" id="menuBackdrop"></div>

<div class="cart-panel" id="cartPanel">

    <span>Total</span>
    <span id="cartTotal">₡0</span>
  </div>
</div>
<div class="cart-panel-backdrop" id="cartPanelBackdrop"></div>

<footer class="register">

    <div class="register-total-block">
      <div class="register-label">TOTAL A PAGAR</div>
      <div class="seven-seg" id="totalDisplay">₡0</div>
    </div>

      </div>
    </div>
  </div>
</footer>

<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <h3>Nombre de la tienda</h3>
    <input type="text" id="nameInput" maxlength="30" placeholder="Escriba el nombre...">
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelName">Cancelar</button>
      <button class="btn-primary" id="saveName">Guardar</button>
    </div>
  </div>
</div>

<div class="payment-overlay" id="paymentOverlay">

      </div>

        <div class="printer-slot"></div>

      <div class="receipt-wrap" id="receiptWrap">

      </div>
      <button class="done-btn" id="doneBtn">LISTO</button>

  </div>
</div>

<div class="toast" id="toast"></div>

  ],
  candy: [

    { name:'Chocolate Oscuro', price:1100, svg:svgDarkChoco },
    { name:'Chocolate Blanco', price:850, svg:svgWhiteChocoCandy },
    { name:'Chocolate con Almendras', price:1200, svg:svgChocoAlmonds },
    { name:'Gomitas', price:600, svg:svgGummies },
    { name:'Ositos de Goma', price:700, svg:svgGummyBears },
    { name:'Gomas de Ácido', price:700, svg:svgSourGummies },
    { name:'Paleta Payaso', price:500, svg:svgLollipopClown },
    { name:'Piruleta Corazón', price:600, svg:svgHeartPop },
    { name:'Piruleta Grande', price:800, svg:svgBigLollipop },
    { name:'Paleta de Caramelo', price:700, svg:svgCaramelPop },
    { name:'Chicle Bomba', price:300, svg:svgGum },
    { name:'Chicle Menta', price:300, svg:svgMintGum },
    { name:'Malvaviscos', price:800, svg:svgMarshmallows },
    { name:'Malvavisco Cubierto', price:950, svg:svgCoatedMarsh },
    { name:'Caramelos (10 uds)', price:500, svg:svgHardCandy },
    { name:'Caramelo de Miel', price:550, svg:svgHoneyCandy },
    { name:'Chocolates Surtidos', price:1500, svg:svgAssortedChocolates },
    { name:'Chocolates Ferrero', price:1800, svg:svgFerrero },
    { name:'Bombones', price:1000, svg:svgBonbons },
    { name:'Bombón de Coco', price:1100, svg:svgCocoBonbon },
    { name:'Nube de Azúcar', price:650, svg:svgSugarCloud },
    { name:'Barquillo', price:900, svg:svgWafer },
    { name:'Turrón', price:1100, svg:svgTurron },
    { name:'Trufas', price:1400, svg:svgTruffles },
    { name:'Peladillas', price:800, svg:svgPeladillas },
    { name:'Cocada', price:900, svg:svgCocada },
    { name:'Mermelada de Fresa', price:1300, svg:svgJam },
    { name:'Galleta de Jengibre', price:850, svg:svgGingerCookie }
  ]
};

/* ============================================================
   ESTADO
   ============================================================ */
let activeCategory = 'fast';
let cart = {};

const $ = id => document.getElementById(id);
const grid = $('grid'), appMain = $('appMain'), catTitle = $('catTitle');
const menuToggle = $('menuToggle'), catMenu = $('catMenu'), catMenuInner = $('catMenuInner');
const menuBackdrop = $('menuBackdrop'), storeNameEl = $('storeName'), storeText = $('storeText');
const totalDisplay = $('totalDisplay'), itemCount = $('itemCount');
const clockDisplay = $('clockDisplay'), ampmDisplay = $('ampmDisplay');
const toast = $('toast'), clearBtn = $('clearBtn'), payBtn = $('payBtn');
const cartToggle = $('cartToggle'), cartPanel = $('cartPanel'), cartPanelBackdrop = $('cartPanelBackdrop');
const cartPanelClose = $('cartPanelClose'), cartList = $('cartList'), cartTotal = $('cartTotal');
const nameModal = $('nameModal'), nameInput = $('nameInput'), cancelName = $('cancelName'), saveName = $('saveName');
const paymentOverlay = $('paymentOverlay'), stageSuccess = $('stageSuccess'), stageReceipt = $('stageReceipt');
const receiptWrap = $('receiptWrap'), receiptContent = $('receiptContent'), successAmount = $('successAmount'), doneBtn = $('doneBtn');

/* ============================================================
   MENÚ CATEGORÍAS
   ============================================================ */
function renderMenu() {
  catMenuInner.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-item' + (cat.id === activeCategory ? ' active' : '');
    btn.type = 'button';
    btn.innerHTML = `<span class="cat-item-emoji">${cat.emoji}</span><span class="cat-item-name">${cat.name}</span><span class="cat-item-count">${PRODUCTS[cat.id].length}</span>`;
    btn.addEventListener('click', () => selectCategory(cat.id));
    catMenuInner.appendChild(btn);
  });
}
function openMenu() {
  renderMenu();
  catMenu.classList.add('open');
  menuBackdrop.classList.add('show');
  document.body.classList.add('menu-open');
}
function closeMenu() {
  catMenu.classList.remove('open');
  menuBackdrop.classList.remove('show');
  document.body.classList.remove('menu-open');
}
menuToggle.addEventListener('click', () => catMenu.classList.contains('open') ? closeMenu() : openMenu());
menuBackdrop.addEventListener('click', closeMenu);

function selectCategory(id) {
  activeCategory = id;
  const cat = CATEGORIES.find(c => c.id === id);
  catTitle.innerHTML = `<span class="ct-emoji">${cat.emoji}</span> ${cat.name}`;
  renderProducts();
  closeMenu();
  appMain.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   PRODUCTOS
   ============================================================ */
function renderProducts() {
  const list = PRODUCTS[activeCategory] || [];
  grid.innerHTML = '';
  list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.style.animationDelay = (i * 12) + 'ms';
    card.innerHTML = `<div class="svg-well">${p.svg()}</div><div class="p-name">${p.name}</div><div class="p-price">₡${p.price.toLocaleString('es-CR')}</div>`;
    card.addEventListener('click', () => addToCart(p, activeCategory, i));
    grid.appendChild(card);
  });
}

/* ============================================================
   CARRITO
   ============================================================ */
function addToCart(product, catId, index) {
  const key = catId + '-' + index;
  if (!cart[key]) cart[key] = { qty: 0, price: product.price, name: product.name };
  cart[key].qty++;
  updateTotal();
  bumpDisplay();
  showToast('✓ ' + product.name + ' agregado');
  if (cartPanel.classList.contains('open')) renderCartPanel();
}
function removeFromCart(key) {
  if (!cart[key]) return;
  const removed = cart[key].name;
  delete cart[key];
  updateTotal();
  renderCartPanel();
  showToast('🗑️ ' + removed + ' eliminado');
}
function updateTotal() {
  let total = 0, count = 0;
  Object.values(cart).forEach(item => {
    total += item.price * item.qty;
    count += item.qty;
  });
  totalDisplay.textContent = '₡' + total.toLocaleString('es-CR');
  itemCount.textContent = count;
}
function bumpDisplay() {
  totalDisplay.classList.add('bump');
  setTimeout(() => totalDisplay.classList.remove('bump'), 180);
}
clearBtn.addEventListener('click', () => {
  if (Object.keys(cart).length === 0) return;
  cart = {};
  updateTotal();
  if (cartPanel.classList.contains('open')) renderCartPanel();
  showToast('🗑️ Carrito limpiado');
});

/* ============================================================
   CART PANEL
   ============================================================ */
function renderCartPanel() {
  const items = Object.entries(cart);
  cartList.innerHTML = '';
  if (items.length === 0) {
    cartList.innerHTML = '<div class="cart-empty">El carrito está vacío</div>';
    cartTotal.textContent = '₡0';
    return;
  }
  let total = 0;
  items.forEach(([key, item]) => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML = `<span class="cart-row-qty">${item.qty}x</span><span class="cart-row-name">${item.name}</span><span class="cart-row-price">₡${subtotal.toLocaleString('es-CR')}</span><button class="cart-row-del" data-key="${key}">✕</button>`;
    row.querySelector('.cart-row-del').addEventListener('click', () => removeFromCart(key));
    cartList.appendChild(row);
  });
  cartTotal.textContent = '₡' + total.toLocaleString('es-CR');
}
function positionCartPanel() {
  const regH = document.querySelector('.register').offsetHeight;
  cartPanel.style.bottom = regH + 'px';
}
function openCartPanel() {
  positionCartPanel();
  renderCartPanel();
  cartPanel.classList.add('open');
  cartPanelBackdrop.classList.add('show');
  cartToggle.classList.add('active');
}
function closeCartPanel() {
  cartPanel.classList.remove('open');
  cartPanelBackdrop.classList.remove('show');
  cartToggle.classList.remove('active');
}
cartToggle.addEventListener('click', () => cartPanel.classList.contains('open') ? closeCartPanel() : openCartPanel());
cartPanelClose.addEventListener('click', closeCartPanel);
cartPanelBackdrop.addEventListener('click', closeCartPanel);

/* ============================================================
   TOAST + RELOJ
   ============================================================ */
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  clockDisplay.textContent = String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
  ampmDisplay.textContent = ampm;
}
setInterval(updateClock, 1000);
updateClock();

/* ============================================================
   NOMBRE DE TIENDA
   ============================================================ */
storeNameEl.addEventListener('click', () => {
  nameInput.value = storeText.textContent.trim();
  nameModal.classList.add('show');
  setTimeout(() => { nameInput.focus(); nameInput.select(); }, 80);
});
function closeNameModal() { nameModal.classList.remove('show'); }
cancelName.addEventListener('click', closeNameModal);
saveName.addEventListener('click', () => {
  const val = nameInput.value.trim();
  if (val) storeText.textContent = val;
  closeNameModal();
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') saveName.click();
  if (e.key === 'Escape') closeNameModal();
});
nameModal.addEventListener('click', e => { if (e.target === nameModal) closeNameModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (nameModal.classList.contains('show')) closeNameModal();
    else if (catMenu.classList.contains('open')) closeMenu();
    else if (cartPanel.classList.contains('open')) closeCartPanel();
  }
});

/* ============================================================
   PAGO
   ============================================================ */
const wait = ms => new Promise(r => setTimeout(r, ms));

payBtn.addEventListener('click', async () => {
  if (Object.keys(cart).length === 0) {
    showToast('El carrito está vacío');
    return;
  }
  closeCartPanel();
  const items = Object.values(cart).map(i => ({ ...i }));
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  const now = new Date();

  stageReceipt.style.display = 'none';
  receiptWrap.style.maxHeight = '0';
  doneBtn.classList.remove('show');

  paymentOverlay.classList.add('show');
  stageSuccess.style.display = 'flex';
  successAmount.textContent = '₡' + total.toLocaleString('es-CR');
  void stageSuccess.offsetWidth;
  stageSuccess.classList.add('active');
  await wait(2300);
  stageSuccess.classList.remove('active');
  await wait(320);
  stageSuccess.style.display = 'none';

  stageReceipt.style.display = 'flex';
  buildReceipt(items, total, now);
  receiptWrap.style.maxHeight = '0';
  void receiptWrap.offsetHeight;
  requestAnimationFrame(() => {
    receiptWrap.style.maxHeight = receiptWrap.scrollHeight + 'px';
  });
  setTimeout(() => doneBtn.classList.add('show'), 1350);
});

function buildReceipt(items, total, date) {
  const storeLabel = storeText.textContent.trim() || 'Mi Tienda';
  const dateStr = date.toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const timeStr = date.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit', hour12: true });
  let linesHTML = '';
  items.forEach(it => {
    linesHTML += `<div class="receipt-line"><span>${it.qty}x ${it.name}</span><span>₡${(it.price * it.qty).toLocaleString('es-CR')}</span></div>`;
  });
  const divider = '<div class="receipt-divider">--------------------------------</div>';
  receiptContent.innerHTML = `
    <div class="receipt-header">
      <div class="receipt-store">${storeLabel}</div>
      <div>San José, Costa Rica</div>
      <div>Tel: 2222-3333</div>
    </div>
    ${divider}
    <div>Fecha: ${dateStr}  ${timeStr}</div>
    ${divider}
    ${linesHTML}
    ${divider}
    <div class="receipt-line receipt-total"><span>TOTAL</span><span>₡${total.toLocaleString('es-CR')}</span></div>
    ${divider}
    <div class="receipt-footer">
      ¡Pura vida, gracias por su compra!<br>
      *** PAGO EFECTUADO ***
      <br>
      <span class="receipt-stamp">✓ PAGADO</span>
    </div>
  `;
}

doneBtn.addEventListener('click', () => {
  paymentOverlay.classList.remove('show');
  stageSuccess.style.display = 'none';
  stageSuccess.classList.remove('active');
  stageReceipt.style.display = 'none';
  receiptWrap.style.maxHeight = '0';
  doneBtn.classList.remove('show');
  cart = {};
  updateTotal();
  showToast('✓ Pago completado');
});

/* ============================================================
   INICIALIZAR
   ============================================================ */
renderMenu();
selectCategory('fast');
updateTotal();
window.addEventListener('resize', () => {
  if (cartPanel.classList.contains('open')) positionCartPanel();
});
</script>
</body>
